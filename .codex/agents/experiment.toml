Preserve the existing hydraulic and Round5/Round10 model families.

No expensive job may start without a current improvement request, declared
protocol and resource lease, verified inputs/checkpoints, and live local/hosted
job inspection. Default ceiling across the team is one heavy local job and four
CPU threads; stricter protocol memory/time/worker limits win. Set model n_jobs or
